    <script>
        const container = document.getElementById('svg-container');

        // Warm pastel palette matching the page's peach/brown theme
        const pastelColors = [
            '#FFDFBA', // Peach
            '#F8D9A0', // Warm gold
            '#FFE7C2', // Apricot
            '#FEC8D8', // Rose
            '#F6C89F', // Tan
            '#FFD8BE', // Blush
            '#F0C6A5'  // Sand
        ];

        const numHearts = 12;
        const animationTypes = ['float1', 'float2', 'float3'];

        // Material-style heart path, natively spans a 24x24 box; centered via translate(-12,-12)
        const heartPath = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';

        function createHeartSVG() {
            let svgHTML = `
                <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="soft-shadow" x="-20%" y="-20%" width="110%" height="110%">
                            <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
                        </filter>
                    </defs>
            `;

            const ww = window.innerWidth;
            const wh = window.innerHeight;

            for (let i = 0; i < numHearts; i++) {
                const x = Math.random() * (ww + 100) - 50;
                const y = Math.random() * (wh + 100) - 50;

                // Extra 4x factor keeps hearts visually comparable in size to the previous flowers
                const scale = (Math.random() * 1.5 + 1) * 4;

                const color = pastelColors[Math.floor(Math.random() * pastelColors.length)];

                const animType = animationTypes[Math.floor(Math.random() * animationTypes.length)];
                const animDuration = Math.random() * 20 + 50;
                const animDelay = Math.random() * -40;

                const heartHTML = `<path d="${heartPath}" transform="translate(-12,-12)" fill="${color}" opacity="0.9"/>`;

                svgHTML += `
                    <g id="heart-base-${i}" transform="translate(${x}, ${y}) scale(${scale})" ">
                        <g class="heart-anim" style="animation-name: ${animType}; animation-duration: ${animDuration}s; animation-delay: ${animDelay}s;">
                            ${heartHTML}
                        </g>
                    </g>
                `;
            }

            svgHTML += `</svg>`;
            container.innerHTML = svgHTML;
        }

        createHeartSVG();

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(createHeartSVG, 300);
        });
    </script>

</body>
